# Mosquitto 2 configuration for the course broker.
#
# Mosquitto 2.0 became "secure by default": as soon as you define a listener,
# anonymous clients are refused unless you explicitly opt in. Before 2.0 a
# fresh install accepted anyone, and thousands of brokers ended up on the
# internet with no password at all. So we leave anonymous access off and log in
# with the demo account from course.env.

# Plain MQTT over TCP. 1883 is the port IANA assigned to MQTT.
listener 1883

# Refuse clients that send no username (this is already the default in
# Mosquitto 2; it is spelled out here because it is the point of lesson 1).
allow_anonymous false

# Usernames and hashed passwords. start.sh creates this file from course.env
# with mosquitto_passwd before the broker starts, so no password hash is
# committed to git. (Mosquitto 2.1 prefers this plugin over the older
# password_file option, which will go away in Mosquitto 3.)
plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/data/passwd

# Print connects, disconnects and errors to `docker compose logs broker`.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %H:%M:%S
